<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fastn Brand System &middot; OG image source</title>
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('fonts/inter-latin.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #18181B; }
  .card {
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(circle at 80% 20%, rgba(124, 92, 231, 0.28), transparent 50%),
      radial-gradient(circle at 20% 80%, rgba(142, 118, 242, 0.18), transparent 55%),
      #18181B;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
    padding: 88px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .icon {
    width: 88px;
    height: 88px;
    border-radius: 18px;
    box-shadow: 0 0 80px rgba(124, 92, 231, 0.45);
    overflow: hidden;
  }
  .icon img { width: 100%; height: 100%; display: block; object-fit: cover; }
  h1 {
    font-weight: 700;
    font-size: 92px;
    line-height: 1.05;
    letter-spacing: -0.03em;
    max-width: 920px;
  }
  .tagline {
    margin-top: 24px;
    color: #BDBDC4;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.01em;
    max-width: 800px;
    line-height: 1.4;
  }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #8A8A92;
    font-size: 22px;
    font-weight: 500;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border: 1px solid #2A2A30;
    border-radius: 9999px;
    color: #BDBDC4;
    font-size: 18px;
  }
  .pill::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #6C5CE7;
    box-shadow: 0 0 16px #6C5CE7;
  }
</style>
</head>
<body>
  <!-- Source for og.png. Render at 1200x630 (deviceScaleFactor: 2 for retina).
       See CONTRIBUTING.md for the regeneration command. -->
  <div class="card">
    <div class="icon">
      <img src="logos/fastn-icon-rounded.jpg" alt="">
    </div>

    <div>
      <h1>The Fastn brand system</h1>
      <p class="tagline">Color, type, logo, voice, and components. One accent, restrained by design.</p>
    </div>

    <div class="footer">
      <div class="pill">fastnai.github.io/fastn-brand</div>
      <div>v3.0</div>
    </div>
  </div>
</body>
</html>
